  @font-face{font-family:"HB Serif";src:url("/handbooks/fonts/hb-serif.woff2") format("woff2");font-weight:400 900;font-display:swap;}
  :root{--brand:#5a67c2;--bg:#F6F6F3;--card:#fff;--ink:#1F2129;--ink2:#5C5C5C;--ink3:#6E6E68;--line:#EAEAE6;
    --sans:-apple-system,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;--serif:"HB Serif","Noto Serif SC","Songti SC",Georgia,serif;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);font:15px/1.7 var(--sans);min-height:100vh;display:flex;flex-direction:column;}
  .top{background:linear-gradient(120deg,var(--brand),#7d76cf);color:#fff;padding:14px 18px;font-family:var(--serif);font-size:19px;font-weight:700;letter-spacing:.14em;}
  .top img{width:26px;height:26px;border-radius:50%;vertical-align:-6px;margin-right:9px;box-shadow:0 0 0 2px rgba(255,255,255,.35);}
  main{flex:1;max-width:760px;margin:0 auto;padding:48px 18px;text-align:center;width:100%;}
  .code{font-family:var(--serif);font-size:72px;font-weight:800;color:var(--brand);line-height:1;}
  h1{font-size:20px;margin:14px 0 8px;}
  p{color:var(--ink2);font-size:14px;}
  .home{display:inline-block;margin:22px 0 8px;background:var(--brand);color:#fff;border-radius:999px;padding:10px 26px;font-size:14px;font-weight:600;text-decoration:none;}
  .home:hover{background:#4c58b0;}
  .nfgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:34px 0 10px;}
  .nfcell{display:block;text-decoration:none;color:var(--ink);}
  .nfcell img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;box-shadow:0 2px 10px rgba(31,33,41,.12);display:block;}
  .nfcell span{display:block;font-size:12px;margin-top:6px;line-height:1.5;height:3em;overflow:hidden;}
  .nfh{font-size:13px;color:var(--ink3);margin-top:26px;}
  footer{padding:20px;text-align:center;color:var(--ink3);font-size:12px;}
  a:focus-visible{outline:2px solid var(--brand);outline-offset:2px;}
  @media (max-width:560px){.nfgrid{grid-template-columns:repeat(2,1fr);}}
</style>
</head>
